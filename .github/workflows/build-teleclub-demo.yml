name: Build Teleclub Demo APK
on:
  push:
    branches: [teleclub-seekee-demo-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p teleclub-demo --no-daemon :app:assembleDebug --stacktrace
      - name: Rename
        run: cp teleclub-demo/app/build/outputs/apk/debug/app-debug.apk Teleclub-Seekee-Demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Teleclub-Seekee-Demo-APK
          path: Teleclub-Seekee-Demo.apk
